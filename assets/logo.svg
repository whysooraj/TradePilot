  <text x="88" y="60" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" font-size="9" font-weight="600" letter-spacing="0.14em" fill="#71717a">VIRTUAL STOCK SIMULATOR</text>
