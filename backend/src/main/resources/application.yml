server:
  port: 8080

spring:
  application:
    name: tradelab-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tradelab}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:TradeLabSuperSecureSecretKeyThatIsAtLeast32BytesLongForHS256Security1234567890}
    expiration-ms: 86400000 # 24 hours
  trading:
    initial-wallet-balance: 100000.0000
    max-quote-age-seconds: 60
    default-fee-rate: 0.0000
    slippage-bps: 0
  market-data:
    provider: mock # mock or dhan or upstox
    tick-interval-ms: 2000
    demo-mode: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
